<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" href="/frontend/icon.PNG">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Pro Tracker</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #222; background: #f2f2f7; }
    body { margin: 0; padding: 24px 15px; } .card { max-width: 400px; margin: auto; padding: 22px; background: #fff; border-radius: 15px; box-shadow: 0 4px 16px #0001; }
    h1, h2 { text-align: center; margin-top: 0; } h1 { font-size: 24px; } h2 { font-size: 20px; }
    input, button { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; font: inherit; }
    button { border: 0; background: #007aff; color: white; font-weight: 700; cursor: pointer; } button.secondary { background: #6c757d; } button.danger { background: #ff3b30; width: auto; margin: 0; padding: 7px 10px; }
    /* !important: rules declared later (e.g. .check { display: flex }) must not un-hide a hidden element. */
    .hidden { display: none !important; } .hint, .error { text-align: center; font-size: 14px; } .hint { color: #666; } .error { color: #c92a20; min-height: 20px; }
    .summary { display: flex; justify-content: space-around; padding: 15px; margin: 12px 0 20px; background: #e3f2fd; border-radius: 10px; color: #0277bd; font-weight: 700; }
    .row { display: flex; gap: 10px; } .row > * { min-width: 0; } .new-food { background: #f8f9fa; border: 2px dashed #007aff; padding: 14px; border-radius: 10px; margin: 12px 0; }
    .user-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 15px; }
    .user-bar .greeting { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meal { display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; background: #fafafa; padding: 10px; border-radius: 8px; margin-top: 8px; }
    .meal small { color: #666; } a { color: #007aff; cursor: pointer; } #food-search { margin-bottom: 4px; }
    .legend { font-size: 13px; color: #666; margin: 0 0 12px; } .check { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 15px; cursor: pointer; }
    .check input { width: auto; margin: 0; }
    .actions { display: flex; gap: 6px; } .actions button { width: auto; margin: 0; padding: 7px 10px; } button.ok { background: #34c759; }
    .tag { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 10px; margin-inline-start: 4px; background: #eee; color: #555; }
    .tag.global { background: #e3f2fd; color: #0277bd; } .tag.personal { background: #f3e8ff; color: #7b2cbf; } .tag.pending { background: #fff4d6; color: #a86b00; } .tag.rejected { background: #ffe3e0; color: #c92a20; }
    .warn { color: #a86b00; font-size: 13px; } .empty { color: #666; font-size: 14px; margin: 4px 0; }
    /* Menu: a 44px button in the header's start corner (right in RTL); the dropdown opens toward the page, never off-screen. */
    .menu-wrap { position: relative; flex-shrink: 0; }
    .menu-button { width: 44px; height: 44px; margin: 0; padding: 0; font-size: 22px; line-height: 1; background: #f2f2f7; color: #222; border-radius: 10px; }
    .menu { position: absolute; top: calc(100% + 6px); inset-inline-start: 0; z-index: 10; width: 220px; max-width: calc(100vw - 40px); padding: 6px; background: #fff; border-radius: 12px; box-shadow: 0 6px 24px #0003; }
    .menu button { min-height: 44px; margin: 0; padding: 10px 12px; background: none; color: #222; text-align: start; font-weight: 600; border-radius: 8px; }
    .menu button:hover, .menu button:focus-visible { background: #f2f2f7; } .menu button.logout { color: #c92a20; }
    .back { display: inline-block; padding: 10px 0; margin-bottom: 6px; font-size: 15px; }
    .date-label { text-align: center; color: #666; font-size: 14px; margin: -8px 0 12px; } .date-label.other-day { color: #a86b00; font-weight: 700; }
    .date-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; } .date-bar input { flex: 1; min-width: 0; margin: 0; }
    .date-bar button { width: auto; margin: 0; padding: 10px 12px; min-height: 44px; }
  </style>
</head>
<body>
  <main class="card">
    <section id="auth-view">
      <h1>Pro Tracker 🥗</h1>
      <div id="login-form">
        <h2>כניסה</h2>
        <input id="login-username" autocomplete="username" placeholder="שם משתמש">
        <input id="login-password" type="password" autocomplete="current-password" placeholder="סיסמה">
        <button id="login-button">התחבר</button>
        <p class="hint">אין לך חשבון? <a id="show-signup">הרשמה</a></p>
      </div>
      <div id="signup-form" class="hidden">
        <h2>הרשמה</h2>
        <input id="signup-username" autocomplete="username" placeholder="שם משתמש (3 תווים לפחות)">
        <input id="signup-password" type="password" autocomplete="new-password" placeholder="סיסמה (8 תווים לפחות)">
        <button id="signup-button">צור חשבון</button>
        <p class="hint">כבר יש חשבון? <a id="show-login">כניסה</a></p>
      </div>
      <p id="auth-error" class="error"></p>
    </section>

    <section id="tracker-view" class="hidden">
      <div class="user-bar">
        <div class="menu-wrap">
          <button id="menu-button" class="menu-button" aria-label="תפריט" aria-haspopup="true" aria-expanded="false" aria-controls="app-menu">☰</button>
          <div id="app-menu" class="menu hidden" role="menu">
            <button role="menuitem" data-panel="log">📖 היומן שלי</button>
            <button role="menuitem" data-panel="my-foods" id="menu-my-foods">🍎 המאכלים שלי</button>
            <button role="menuitem" data-panel="friends">👥 חברים</button>
            <button role="menuitem" id="menu-date">📅 שינוי תאריך</button>
            <button role="menuitem" data-panel="admin" id="menu-admin" class="admin-only hidden">🛡️ הצעות ממתינות</button>
            <button role="menuitem" id="logout" class="logout">🚪 התנתק</button>
          </div>
        </div>
        <span class="greeting">שלום, <strong id="username"></strong></span>
      </div>

      <!-- One panel is visible at a time; the menu switches between them (see showPanel). friends.js adds #panel-friends. -->
      <div id="panel-log" class="panel">
        <h1>יומן האוכל שלי 🥗</h1>
        <p id="date-label" class="date-label"></p>
        <div id="date-bar" class="date-bar hidden">
          <input type="date" id="date-picker" aria-label="תאריך">
          <button id="date-today" class="secondary">היום</button>
          <button id="date-close" class="secondary" aria-label="סגור">✕</button>
        </div>
        <div class="summary"><span>🔥 קלוריות: <b id="total-cal">0</b></span><span>💪 חלבון: <b id="total-pro">0</b>g</span></div>
        <input id="food-search" list="food-options" placeholder="חפש או בחר מאכל...">
        <datalist id="food-options"></datalist>
        <p class="legend admin-only hidden"><span class="tag global">🌍 כללי</span> מאגר משותף לכולם · <span class="tag personal">👤 אישי</span> רק אתה רואה</p>
        <input id="amount" type="number" min="1" placeholder="כמות בגרמים">
        <button id="add-meal">הוסף ארוחה</button>
        <div id="new-food" class="new-food hidden">
          <h2>מאכל חדש</h2>
          <input id="new-food-name" readonly>
          <div class="row"><input id="new-food-cal" type="number" min="0" placeholder="קלוריות ל-100ג׳"><input id="new-food-pro" type="number" min="0" placeholder="חלבון ל-100ג׳"></div>
          <label class="check"><input id="new-food-suggest" type="checkbox"> הצע לכולם (יתווסף למאגר הכללי אחרי אישור מנהל)</label>
          <label class="check admin-only hidden"><input id="new-food-global" type="checkbox"> הוסף ישירות למאגר הכללי (מנהל)</label>
          <button id="save-food">שמור למאגר האישי שלי</button>
        </div>
        <div id="meal-list"></div>
        <p id="tracker-error" class="error"></p>
      </div>

      <section id="panel-my-foods" class="panel hidden">
        <a class="back" data-panel="log">→ חזרה ליומן</a>
        <h2 id="my-foods-title">המאכלים שלי</h2>
        <div id="edit-food" class="new-food hidden">
          <h2>עריכת מאכל</h2>
          <input id="edit-food-name" placeholder="שם המאכל">
          <div class="row"><input id="edit-food-cal" type="number" min="0" placeholder="קלוריות ל-100ג׳"><input id="edit-food-pro" type="number" min="0" placeholder="חלבון ל-100ג׳"></div>
          <label id="edit-food-suggest-row" class="check"><input id="edit-food-suggest" type="checkbox"> הצע לכולם</label>
          <div class="row"><button id="edit-food-save">שמור</button><button id="edit-food-cancel" class="secondary">ביטול</button></div>
        </div>
        <div id="my-food-list"></div>
        <p id="my-foods-error" class="error"></p>
      </section>

      <section id="panel-admin" class="panel hidden">
        <a class="back" data-panel="log">→ חזרה ליומן</a>
        <h2 id="admin-title">הצעות ממתינות 🛡️</h2>
        <div id="suggestion-list"></div>
        <p id="admin-error" class="error"></p>
      </section>
    </section>
  </main>

  <!-- ?v= busts the browser's HTTP cache for these files after a deploy; bump it whenever they change. -->
  <script src="/frontend/day.js?v=2"></script>
  <script>
    const state = { token: localStorage.getItem('proTrackerToken'), foods: [], user: null, editing: null, panel: 'log', restoreTimer: null };
    const $ = id => document.getElementById(id);
    const setError = (id, message = '') => $(id).textContent = message;
    const show = (id, visible) => $(id).classList.toggle('hidden', !visible);
    const today = () => trackerDay();
    const isAdmin = () => !!(state.user && state.user.is_admin);
    const PANELS = ['log', 'my-foods', 'friends', 'admin'];
    const ERROR_MESSAGES = {
      duplicate_global: 'כבר קיים מאכל בשם הזה במאגר הכללי.',
      duplicate_global_suggestion: 'כבר קיים מאכל בשם הזה במאגר הכללי, ולכן אי אפשר להציע אותו לכולם.',
      duplicate_global_blocked: 'כבר קיים מאכל בשם הזה במאגר הכללי.',
      edit_before_resuggest: 'ההצעה נדחתה. ערוך את המאכל לפני שתציע אותו שוב.',
      food_in_use: 'המאכל מופיע ברשומות ארוחה ולכן אי אפשר למחוק אותו.',
    };

    async function request(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (state.token) headers.Authorization = `Bearer ${state.token}`;
      if (options.body) headers['Content-Type'] = 'application/json';
      const response = await fetch(path, { ...options, headers });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        const detail = body.detail;
        const message = typeof detail === 'string' ? detail : (detail && (ERROR_MESSAGES[detail.code] || detail.message)) || '';
        const error = new Error(message || `שגיאת שרת (${response.status}). נסה שוב בעוד רגע.`);
        error.status = response.status; error.code = detail && detail.code;
        throw error;
      }
      return response.status === 204 ? null : response.json();
    }

    const normalize = text => text.trim().split(/\s+/).join(' ').toLowerCase();
    // Admins see (and match) every food by a label with its pool's icon. Regular users see the plain name; only when
    // one of their personal foods shares a name with a global one do both get a text label, so they can still pick.
    function foodLabel(food) {
      if (isAdmin()) return `${food.name} ${food.scope === 'global' ? '🌍' : '👤'}`;
      const shared = state.foods.some(other => other.id !== food.id && normalize(other.name) === normalize(food.name));
      return shared ? `${food.name} (${food.scope === 'global' ? 'כללי' : 'שלי'})` : food.name;
    }
    function matchFoods(text) {
      const exact = state.foods.find(food => foodLabel(food) === text);
      return exact ? [exact] : state.foods.filter(food => normalize(food.name) === normalize(text));
    }
    function element(tag, className, text) { const node = document.createElement(tag); if (className) node.className = className; if (text !== undefined) node.textContent = text; return node; }
    function button(text, className, onclick) { const node = element('button', className, text); node.onclick = onclick; return node; }
    function foodTags(food) {
      const tags = [];
      if (isAdmin()) tags.push(food.scope === 'global' ? element('span', 'tag global', '🌍 כללי') : element('span', 'tag personal', '👤 אישי'));
      if (food.suggestion_status === 'pending') tags.push(element('span', 'tag pending', 'ממתין לאישור'));
      if (food.suggestion_status === 'rejected') tags.push(element('span', 'tag rejected', 'ההצעה נדחתה'));
      return tags;
    }
    // A personal copy of a global name is allowed after the user confirms; suggestions of global names are blocked by the server.
    const confirmDuplicate = error => error.code === 'duplicate_global' && confirm('כבר קיים מאכל בשם הזה במאגר הכללי 🌍. לשמור בכל זאת עותק אישי?');

    // ----- menu & panels ---------------------------------------------------------
    function setMenuOpen(open) { show('app-menu', open); $('menu-button').setAttribute('aria-expanded', String(open)); }
    // Shows one panel and hides the others. The selected date is never touched here, so it survives panel switches.
    function showPanel(name) {
      if (!PANELS.includes(name) || (name === 'admin' && !isAdmin())) name = 'log';
      PANELS.forEach(panel => { const node = $(`panel-${panel}`); if (node) node.classList.toggle('hidden', panel !== name); });
      state.panel = name; setMenuOpen(false);
      if (name !== 'log') show('date-bar', false);
      if (name === 'admin') { setError('admin-error'); loadSuggestions().catch(error => setError('admin-error', error.message)); }
      document.dispatchEvent(new CustomEvent('pro-tracker:panel', { detail: name }));  // friends.js loads its data on this
      window.scrollTo(0, 0);
    }
    window.proTrackerShowPanel = showPanel;  // used by notifications.js ("open friends" from a notification)

    // ----- date --------------------------------------------------------------------
    const DATE_FORMAT = new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'numeric', year: 'numeric', timeZone: 'UTC' });
    function renderDateLabel() {
      const value = $('date-picker').value, isToday = value === today(), label = $('date-label');
      label.replaceChildren(`📅 ${isToday ? 'היום · ' : ''}${DATE_FORMAT.format(new Date(`${value}T00:00:00Z`))}`);
      label.classList.toggle('other-day', !isToday);
      if (!isToday) { const back = element('a', '', 'חזרה להיום'); back.onclick = () => changeDate(today()); label.append(' · ', back); }
    }
    function changeDate(value) { $('date-picker').value = value || today(); renderDateLabel(); return loadSummary().catch(showTrackerError); }
    function openDatePicker() {
      showPanel('log'); show('date-bar', true);
      const picker = $('date-picker');
      try { picker.showPicker(); } catch (_) { picker.focus(); }  // showPicker is not available in every browser
    }

    // ----- auth --------------------------------------------------------------------
    function forgetToken() { localStorage.removeItem('proTrackerToken'); state.token = null; }
    function displayAuth(signup = false) { setMenuOpen(false); show('auth-view', true); show('tracker-view', false); show('login-form', !signup); show('signup-form', signup); setError('auth-error'); }
    function displayTracker(user) {
      clearTimeout(state.restoreTimer);
      state.user = user; $('username').textContent = user.username; show('auth-view', false); show('tracker-view', true);
      $('date-picker').value = today(); renderDateLabel(); show('date-bar', false);
      document.querySelectorAll('.admin-only').forEach(node => node.classList.toggle('hidden', !user.is_admin));
      state.editing = null; show('edit-food', false); showPanel('log');
      loadFoods().then(loadSummary).then(loadSuggestions).catch(showTrackerError);
    }
    function showTrackerError(error) { setError('tracker-error', error.message); }

    async function authenticate(endpoint, usernameId, passwordId) {
      setError('auth-error');
      try {
        const data = await request(endpoint, { method: 'POST', body: JSON.stringify({ username: $(usernameId).value.trim(), password: $(passwordId).value }) });
        clearTimeout(state.restoreTimer);
        state.token = data.token; localStorage.setItem('proTrackerToken', state.token); displayTracker(data.user);
      } catch (error) { setError('auth-error', error.message); }
    }

    // Opening the app with a stored token. Sessions don't expire, so only a 401 (session really gone) forgets the token;
    // no network, a server that is waking up or a 5xx keeps it and retries, so the user stays logged in.
    async function restoreSession(attempt = 0) {
      const token = state.token;
      if (!token) return displayAuth();
      try {
        const user = await request('/auth/me');
        if (state.token === token) displayTracker(user);
      } catch (error) {
        if (state.token !== token) return;  // the user logged in (or out) in the meantime
        if (error.status === 401) { forgetToken(); displayAuth(); return; }
        if (attempt === 0) displayAuth();
        setError('auth-error', 'אין חיבור לשרת כרגע. מנסה להתחבר שוב…');
        state.restoreTimer = setTimeout(() => restoreSession(attempt + 1), Math.min(30000, 2000 * 2 ** attempt));
      }
    }

    async function logOut() {
      setMenuOpen(false);
      try { await request('/auth/logout', { method: 'POST' }); } catch (_) { /* this device logs out regardless */ }
      forgetToken(); state.user = null; displayAuth();
    }

    // ----- foods, meals, suggestions -------------------------------------------------
    async function loadFoods() {
      state.foods = await request('/foods/');
      const list = $('food-options'); list.replaceChildren();
      state.foods.forEach(food => {
        const option = document.createElement('option'); option.value = foodLabel(food);
        if (isAdmin()) option.label = food.scope === 'global' ? 'מאגר כללי' : (food.suggestion_status === 'pending' ? 'אישי · ממתין לאישור' : 'אישי');
        else if (food.suggestion_status === 'pending') option.label = 'ממתין לאישור';
        list.append(option);
      });
      renderMyFoods();
    }

    async function loadSummary() {
      const data = await request(`/summary/${$('date-picker').value}`);
      $('total-cal').textContent = data.total_calories; $('total-pro').textContent = data.total_protein;
      const list = $('meal-list'); list.replaceChildren();
      if (!data.meals.length) { list.textContent = 'עוד לא אכלת כלום ביום זה.'; return; }
      data.meals.forEach(meal => {
        const item = document.createElement('div'); item.className = 'meal';
        const text = document.createElement('div'); text.innerHTML = `<strong></strong><br><small>${meal.amount_grams}g · ${meal.calories} קל׳ · ${meal.protein}g חלבון</small>`; text.querySelector('strong').textContent = meal.food_name;
        const remove = document.createElement('button'); remove.className = 'danger'; remove.textContent = 'מחק'; remove.onclick = () => deleteRecord(meal.record_id);
        item.append(text, remove); list.append(item);
      });
    }

    async function addMeal() {
      setError('tracker-error'); const name = $('food-search').value.trim(), amount = Number($('amount').value);
      if (!name || !amount) return showTrackerError(new Error('יש לבחור מאכל וכמות.'));
      const matches = matchFoods(name);
      if (matches.length > 1) return showTrackerError(new Error(isAdmin() ? 'יש כמה מאכלים בשם הזה – בחר מהרשימה (🌍 כללי או 👤 אישי).' : 'יש כמה מאכלים בשם הזה – בחר מהרשימה (כללי או שלי).'));
      const food = matches[0];
      if (!food) { $('new-food-name').value = name; $('new-food-suggest').checked = false; $('new-food-global').checked = false; show('new-food', true); return; }
      try { await request('/records/', { method: 'POST', body: JSON.stringify({ food_id: food.id, amount_grams: amount, date: $('date-picker').value }) }); $('food-search').value = ''; $('amount').value = ''; await loadSummary(); } catch (error) { showTrackerError(error); }
    }

    async function saveFood(allowDuplicate = false) {
      setError('tracker-error');
      const body = { name: $('new-food-name').value, calories: Number($('new-food-cal').value), protein: Number($('new-food-pro').value),
                     suggest: $('new-food-suggest').checked, is_global: isAdmin() && $('new-food-global').checked, allow_duplicate: allowDuplicate };
      try {
        const food = await request('/foods/', { method: 'POST', body: JSON.stringify(body) });
        await loadFoods(); show('new-food', false); $('food-search').value = foodLabel(food); $('new-food-cal').value = ''; $('new-food-pro').value = ''; await addMeal();
        if (food.suggestion_status === 'pending') await loadSuggestions();
      } catch (error) {
        if (confirmDuplicate(error)) return saveFood(true);
        showTrackerError(error);
      }
    }

    function renderMyFoods() {
      const admin = isAdmin();
      $('my-foods-title').textContent = admin ? 'ניהול מאכלים 👤🌍' : 'המאכלים שלי';
      $('menu-my-foods').textContent = admin ? '🍎 ניהול מאכלים' : '🍎 המאכלים שלי';
      const list = $('my-food-list'); list.replaceChildren();
      const editable = state.foods.filter(food => food.can_edit);  // own personal foods; admins also get the global ones
      if (!editable.length) { list.append(element('p', 'empty', 'עוד לא הוספת מאכלים אישיים.')); return; }
      editable.forEach(food => {
        const item = element('div', 'meal'), text = element('div');
        text.append(element('strong', '', food.name), ...foodTags(food), element('br'), element('small', '', `${food.calories} קל׳ · ${food.protein}g חלבון ל-100ג׳`));
        const actions = element('div', 'actions');
        actions.append(button('ערוך', 'secondary', () => startEdit(food)), button('מחק', 'danger', () => deleteFood(food)));
        item.append(text, actions); list.append(item);
      });
    }

    function startEdit(food) {
      state.editing = food; setError('my-foods-error');
      $('edit-food-name').value = food.name; $('edit-food-cal').value = food.calories; $('edit-food-pro').value = food.protein;
      $('edit-food-suggest').checked = food.suggestion_status === 'pending'; show('edit-food-suggest-row', food.scope === 'personal');
      show('edit-food', true); $('edit-food-name').focus();
    }

    async function saveEdit(allowDuplicate = false) {
      const food = state.editing; if (!food) return; setError('my-foods-error');
      const body = { name: $('edit-food-name').value, calories: Number($('edit-food-cal').value), protein: Number($('edit-food-pro').value), allow_duplicate: allowDuplicate };
      if (food.scope === 'personal') body.suggest = $('edit-food-suggest').checked;
      try {
        await request(`/foods/${food.id}`, { method: 'PUT', body: JSON.stringify(body) });
        state.editing = null; show('edit-food', false); await loadFoods(); await loadSummary(); await loadSuggestions();
      } catch (error) {
        if (confirmDuplicate(error)) return saveEdit(true);
        setError('my-foods-error', error.message);
      }
    }

    async function deleteFood(food) {
      if (!confirm(`למחוק את "${food.name}"?`)) return; setError('my-foods-error');
      try {
        await request(`/foods/${food.id}`, { method: 'DELETE' });
        if (state.editing && state.editing.id === food.id) { state.editing = null; show('edit-food', false); }
        await loadFoods(); await loadSuggestions();
      } catch (error) { setError('my-foods-error', error.message); }
    }

    async function loadSuggestions() {
      if (!isAdmin()) return;
      const suggestions = await request('/admin/suggestions');
      $('admin-title').textContent = `הצעות ממתינות 🛡️ (${suggestions.length})`;
      $('menu-admin').textContent = `🛡️ הצעות ממתינות (${suggestions.length})`;
      const list = $('suggestion-list'); list.replaceChildren();
      if (!suggestions.length) { list.append(element('p', 'empty', 'אין הצעות ממתינות.')); return; }
      suggestions.forEach(food => {
        const item = element('div', 'meal'), text = element('div');
        text.append(element('strong', '', food.name), element('br'), element('small', '', `${food.calories} קל׳ · ${food.protein}g חלבון ל-100ג׳ · הוצע ע״י ${food.owner_username}`));
        if (food.duplicate_of_global_id) text.append(element('br'), element('span', 'warn', '⚠️ כבר קיים מאכל כללי בשם הזה – אי אפשר לאשר.'));
        const actions = element('div', 'actions');
        const approve = button('אשר', 'ok', () => decideSuggestion(food.id, 'approve')); approve.disabled = !!food.duplicate_of_global_id;
        actions.append(approve, button('דחה', 'danger', () => decideSuggestion(food.id, 'reject')));
        item.append(text, actions); list.append(item);
      });
    }

    async function decideSuggestion(id, action) {
      setError('admin-error');
      try { await request(`/admin/suggestions/${id}/${action}`, { method: 'POST' }); await loadFoods(); await loadSuggestions(); }
      catch (error) { setError('admin-error', error.message); }
    }

    async function deleteRecord(id) { if (!confirm('למחוק את הארוחה?')) return; try { await request(`/records/${id}`, { method: 'DELETE' }); await loadSummary(); } catch (error) { showTrackerError(error); } }

    // ----- wiring ------------------------------------------------------------------
    $('show-signup').onclick = () => displayAuth(true); $('show-login').onclick = () => displayAuth(false);
    $('login-button').onclick = () => authenticate('/auth/login', 'login-username', 'login-password'); $('signup-button').onclick = () => authenticate('/auth/signup', 'signup-username', 'signup-password');
    $('add-meal').onclick = addMeal; $('save-food').onclick = () => saveFood();
    $('date-picker').onchange = () => changeDate($('date-picker').value);
    $('date-today').onclick = () => changeDate(today()); $('date-close').onclick = () => show('date-bar', false);
    $('new-food-suggest').onchange = () => { if ($('new-food-suggest').checked) $('new-food-global').checked = false; };
    $('new-food-global').onchange = () => { if ($('new-food-global').checked) $('new-food-suggest').checked = false; };
    $('edit-food-save').onclick = () => saveEdit(); $('edit-food-cancel').onclick = () => { state.editing = null; show('edit-food', false); };
    $('menu-button').onclick = () => setMenuOpen($('app-menu').classList.contains('hidden'));
    $('menu-date').onclick = openDatePicker;
    $('logout').onclick = logOut;  // keep the id: notifications.js unsubscribes this device on a click on #logout
    // Any [data-panel] element (menu items, "back" links, also the ones friends.js adds later) switches panels.
    document.addEventListener('click', event => { const target = event.target.closest('[data-panel]'); if (target) showPanel(target.dataset.panel); });
    // Close the menu on a tap outside it. pointerdown, because iOS Safari fires no "click" on non-interactive elements.
    document.addEventListener('pointerdown', event => { if (!event.target.closest('.menu-wrap')) setMenuOpen(false); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') setMenuOpen(false); });
    restoreSession();
  </script>
  <script src="/frontend/friends.js?v=2"></script>
  <script src="/frontend/notifications.js?v=2"></script>
</body>
</html>
